services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: trackrace_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
    networks:
      - trackrace_net

  nginx:
    image: nginx:alpine
    container_name: trackrace_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - trackrace_net

  mysql:
    image: mysql:8.0
    container_name: trackrace_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trackrace
      MYSQL_USER: trackrace
      MYSQL_PASSWORD: trackrace
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - trackrace_net

volumes:
  mysql_data:

networks:
  trackrace_net:
    driver: bridge
